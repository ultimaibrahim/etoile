<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada (404) · étoile</title>
    <meta name="description" content="La página que buscas no existe o ha sido movida dentro del Dashboard de étoile.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #2D47B5;
            --verde-deep: #0A0F24;
            --sage: #9DB4FF;
            --oro: #FFC27A;
            --crema: #ECE6D6;
            --surface: #141A33;
            --surface-2: #1B2240;
            --border: rgba(236, 230, 214, 0.12);
            --text: #ECE6D6;
            --text-muted: #A9ADBE;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--verde-deep);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(184, 144, 47, 0.08) 0%, rgba(61, 90, 71, 0.04) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 520px;
            width: 100%;
            padding: 44px 36px;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .brand-eyebrow {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--oro);
            margin-bottom: 12px;
        }
        .code-display {
            font-family: 'Playfair Display', serif;
            font-size: clamp(64px, 15vw, 92px);
            color: var(--crema);
            line-height: 1;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(184, 144, 47, 0.2);
        }
        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--crema);
            margin-bottom: 14px;
        }
        .error-title span {
            color: var(--sage);
            font-style: italic;
        }
        .error-desc {
            font-size: 14.5px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .actions-wrap {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--verde);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-primary:hover {
            background: #3C56C4;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--sage);
        }
        .countdown-text {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .countdown-text strong {
            color: var(--oro);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="error-card">
        <div class="brand-eyebrow">étoile</div>
        <div class="code-display">404</div>
        <h1 class="error-title">Ubicación <span>no encontrada</span></h1>
        <p class="error-desc">
            La página o el recurso solicitado no existe, ha cambiado de dirección o fue reorganizado dentro del sistema.
        </p>
        <div class="actions-wrap">
            <a href="/" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Ir al Dashboard</span>
            </a>
            <a href="/#/acerca" class="btn btn-secondary">
                <span>Metodología y Ayuda</span>
            </a>
        </div>
    </div>
</body>
</html>
