    <!-- De noche desde el primer cuadro: así la «puerta» de /info/ (vida.js) continúa sin destello -->
    <style>
      html, body { background: #0A0F24; }
      /* Participa en las transiciones entre páginas de /info/: de noche a noche, sin corte */
      @view-transition { navigation: auto; }
      ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; }
    </style>
    <!-- Si el destino no participa (la app), la transición saliente se cancela sola: se atiende para que no ensucie la consola -->
    <script>['pageswap', 'pagereveal'].forEach(t => addEventListener(t, e => { const v = e.viewTransition; if (v) { v.ready.catch(() => {}); v.finished.catch(() => {}); v.updateCallbackDone && v.updateCallbackDone.catch(() => {}); } }));</script>
